                          }
                          Toast.makeText(context, "OmniTask: Alarma pospuesta 10 min", Toast.LENGTH_SHORT).show();
                      } catch (Exception ignored) {}
                      return;
                  }

                  PowerManager pm = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                  PowerManager.WakeLock wl = null;
                  if (pm != null) {
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "OmniTask:AlarmWake");
                      wl.acquire(10000L);
                  }
                  try {
                      String title = intent.getStringExtra("title");
                      String body = intent.getStringExtra("body");
                      if (title == null || title.isEmpty()) title = "OmniTask · Alarma";
                      if (body == null || body.isEmpty()) body = "Tienes un recordatorio programado.";
                      if (nm == null) return;

                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      if (soundUri == null) soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID,
                              "Alarmas y Recordatorios OmniTask",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          ch.setDescription("Alertas exactas aunque la app esté cerrada");
                          ch.enableVibration(true);
                          ch.setVibrationPattern(new long[]{0, 600, 300, 600, 300});
                          if (soundUri != null) {
                              AudioAttributes aa = new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build();
                              ch.setSound(soundUri, aa);
                          }
                          nm.createNotificationChannel(ch);
                      }

                      Intent openInt = new Intent(context, MainActivity.class);
                      openInt.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(
                          context, alarmId, openInt,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Intent dismissInt = new Intent(context, OmniTaskAlarmReceiver.class);
                      dismissInt.setAction(ACTION_DISMISS);
                      dismissInt.putExtra("alarmId", alarmId);
                      PendingIntent dismissPi = PendingIntent.getBroadcast(
                          context, alarmId + 100000, dismissInt,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Intent snoozeInt = new Intent(context, OmniTaskAlarmReceiver.class);
                      snoozeInt.setAction(ACTION_SNOOZE);
                      snoozeInt.putExtra("alarmId", alarmId);
                      snoozeInt.putExtra("title", title);
                      snoozeInt.putExtra("body", body);
                      PendingIntent snoozePi = PendingIntent.getBroadcast(
                          context, alarmId + 200000, snoozeInt,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      NotificationCompat.Builder nb = new NotificationCompat.Builder(context, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_ALARM)
                          .setAutoCancel(true)
                          .setDefaults(NotificationCompat.DEFAULT_VIBRATE)
                          .setContentIntent(pi)
                          .addAction(0, "🔇 Apagar", dismissPi)
                          .addAction(0, "⏰ Posponer 10 min", snoozePi);
                      if (soundUri != null) nb.setSound(soundUri);

                      Notification notif = nb.build();
                      notif.flags |= Notification.FLAG_INSISTENT;
                      nm.notify(alarmId, notif);
                  } finally {
                      if (wl != null && wl.isHeld()) {
                          try { wl.release(); } catch (Exception ignored) {}
                      }
                  }
              }
          }
          RXEOF
            BOOT_PATH="$(dirname "$MAIN_ACT")/OmniTaskBootReceiver.java"
            cat > "$BOOT_PATH" << 'BOOTEOF'
          package cl.vorax2009.micalendario;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONObject;
          import java.util.Map;

          public class OmniTaskBootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String act = intent != null ? intent.getAction() : null;
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(act)
                      && !Intent.ACTION_TIME_CHANGED.equals(act)
                      && !Intent.ACTION_TIMEZONE_CHANGED.equals(act)
                      && !Intent.ACTION_MY_PACKAGE_REPLACED.equals(act)) return;
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  SharedPreferences sp = context.getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE);
                  long now = System.currentTimeMillis();
                  for (Map.Entry<String, ?> entry : sp.getAll().entrySet()) {
                      if (!entry.getKey().startsWith("a_")) continue;
                      try {
                          JSONObject obj = new JSONObject(String.valueOf(entry.getValue()));
                          long ts = obj.optLong("ts", 0);
                          if (ts <= now) {
                              sp.edit().remove(entry.getKey()).apply();
                              continue;
                          }
                          int id = obj.getInt("id");
                          String title = obj.optString("title", "OmniTask · Alarma");
                          String body = obj.optString("body", "Recordatorio programado");
                          Intent rxIntent = new Intent(context, OmniTaskAlarmReceiver.class);
                          rxIntent.putExtra("alarmId", id);
                          rxIntent.putExtra("title", title);
                          rxIntent.putExtra("body", body);
                          PendingIntent pi = PendingIntent.getBroadcast(
                              context, id, rxIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          Intent showInt = new Intent(context, MainActivity.class);
                          PendingIntent showPi = PendingIntent.getActivity(
                              context, id, showInt,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          if (Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms()) {
                              am.setAlarmClock(new AlarmManager.AlarmClockInfo(ts, showPi), pi);
                          } else if (Build.VERSION.SDK_INT >= 23) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, ts, pi);
                          } else {
                              am.set(AlarmManager.RTC_WAKEUP, ts, pi);
                          }
                      } catch (Exception ignored) {}
                  }
                  OmniTaskWidgetProvider.refreshAllWidgets(context);
              }
          }
          BOOTEOF
            WIDGET_PATH="$(dirname "$MAIN_ACT")/OmniTaskWidgetProvider.java"
            cat > "$WIDGET_PATH" << 'WIDGETEOF'
          package cl.vorax2009.micalendario;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import org.json.JSONObject;

          public class OmniTaskWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, id);
                  }
              }

              public static void refreshAllWidgets(Context context) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      ComponentName cn = new ComponentName(context, OmniTaskWidgetProvider.class);
                      int[] ids = mgr.getAppWidgetIds(cn);
                      if (ids != null) {
                          for (int id : ids) {
                              updateSingleWidget(context, mgr, id);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private static void updateSingleWidget(Context context, AppWidgetManager mgr, int appWidgetId) {
                  try {
                      SharedPreferences sp = context.getSharedPreferences("omnitask_widget_prefs", Context.MODE_PRIVATE);
                      String raw = sp.getString("widget_json", "");
                      String todayLabel = "OmniTask Hoy";
                      String shift = "Sin turno hoy";
                      String nextBill = "Sin cuentas próximas";
                      String reminder = "Todo al día";
                      if (raw != null && !raw.isEmpty()) {
                          JSONObject obj = new JSONObject(raw);
                          todayLabel = obj.optString("todayLabel", todayLabel);
                          shift = obj.optString("shift", shift);
                          nextBill = obj.optString("nextBill", nextBill);
                          reminder = obj.optString("reminder", reminder);
                      }

                      java.util.Calendar cal = java.util.Calendar.getInstance();
                      String[] meses = {"ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"};
                      String[] dias = {"","domingo","lunes","martes","miércoles","jueves","viernes","sábado"};
                      String dayNum = String.valueOf(cal.get(java.util.Calendar.DAY_OF_MONTH));
                      String monthShort = meses[cal.get(java.util.Calendar.MONTH)];
                      String weekdayName = dias[cal.get(java.util.Calendar.DAY_OF_WEEK)];

                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.omnitask_widget);
                      views.setTextViewText(R.id.ot_widget_day_num, dayNum);
                      views.setTextViewText(R.id.ot_widget_month_short, monthShort);
                      views.setTextViewText(R.id.ot_widget_weekday, weekdayName);
                      views.setTextViewText(R.id.ot_widget_shift, "🕒 " + shift);
                      views.setTextViewText(R.id.ot_widget_bill, "💸 " + nextBill);
                      views.setTextViewText(R.id.ot_widget_reminder, "📌 " + reminder);

                      Intent openApp = new Intent(context, MainActivity.class);
                      openApp.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent openPi = PendingIntent.getActivity(
                          context, 9100 + appWidgetId, openApp,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      views.setOnClickPendingIntent(R.id.ot_widget_root, openPi);

                      Intent quickNote = new Intent(context, MainActivity.class);
                      quickNote.putExtra("omnitask_action", "quick_note");
                      quickNote.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      PendingIntent notePi = PendingIntent.getActivity(
                          context, 9200 + appWidgetId, quickNote,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      views.setOnClickPendingIntent(R.id.ot_widget_add_btn, notePi);

                      mgr.updateAppWidget(appWidgetId, views);
                  } catch (Exception ignored) {}
              }
          }
          WIDGETEOF

