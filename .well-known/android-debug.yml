name: Android APK y AAB Firmado (OmniTask Play Store)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 (Compatible con Gradle de Capacitor 6)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Armar carpetas web y recursos
        run: |
          mkdir -p www assets
          cp index.html privacy.html sw.js manifest.webmanifest icon.svg version.json www/
          cp omnitask-icon-*.png screenshot-*.png www/
          cp icon-only.png assets/icon-only.png
          cp icon-only.png assets/icon.png
          cp icon-only.png assets/icon-foreground.png

      - name: Precompilar Tailwind CSS (regenera todas las clases del index.html)
        continue-on-error: true
        run: |
          cat > tailwind.config.js << 'TWCFG'
          module.exports = {
            content: ["./www/index.html"],
            theme: {
              extend: {
                fontFamily: {
                  sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                }
              }
            }
          }
          TWCFG
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind-input.css

          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i tailwind-input.css -o www/tailwind-compiled.css --minify

          if [ -s www/tailwind-compiled.css ]; then
            node -e '
              const fs = require("fs");
              const html = fs.readFileSync("www/index.html", "utf8");
              const css = fs.readFileSync("www/tailwind-compiled.css", "utf8");
              if (css.length < 5000) { console.log("CSS demasiado corto, se conserva el del index.html"); process.exit(0); }
              const re = /<style id="tailwind-compiled">[\s\S]*?<\/style>/;
              if (!re.test(html)) { console.log("No se encontró el bloque tailwind-compiled"); process.exit(0); }
              const updated = html.replace(re, () => `<style id="tailwind-compiled">${css}</style>`);
              fs.writeFileSync("www/index.html", updated, "utf8");
              console.log("Tailwind CSS regenerado:", css.length, "bytes");
            '
            rm -f www/tailwind-compiled.css
          fi

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android Capacitor
        run: npx cap add android

      - name: Generar iconos nativos Android
        run: |
          if command -v convert >/dev/null 2>&1; then
            convert -size 1024x1024 xc:"#070C1B" assets/icon-background.png
          fi
          npx capacitor-assets generate --android --iconBackgroundColor "#070C1B" --iconBackgroundColorDark "#070C1B" || true
          if command -v convert >/dev/null 2>&1; then
            for pair in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
              IFS=':' read -r dens sz fg <<< "$pair"
              dir="android/app/src/main/res/mipmap-$dens"
              mkdir -p "$dir"
              convert icon-only.png -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert icon-only.png -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert icon-only.png -resize "${fg}x${fg}" "$dir/ic_launcher_foreground.png"
            done
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Instalar Android SDK Platform 35 si no está presente
        run: |
          if [ -n "$ANDROID_HOME" ] && [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi

      - name: Configurar Target SDK 36, Márgenes de Sistema, Sincronización Directa con Google Calendar y Firma Keystore
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omnitask' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Cargar Keystore (.jks): prioridad GitHub Secrets, respaldo archivo del repo privado
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/omnitask-upload-keystore.jks
            echo "Keystore cargado de forma segura desde GitHub Secrets"
          elif [ -f "omnitask-upload-keystore.jks" ]; then
            cp omnitask-upload-keystore.jks android/app/omnitask-upload-keystore.jks
            echo "Keystore cargado desde el repositorio privado"
          else
            echo "ERROR: No se encontró KEYSTORE_BASE64 en Secrets ni omnitask-upload-keystore.jks en el repo privado."
            exit 1
          fi

          # 2. Agregar permisos READ_CALENDAR / WRITE_CALENDAR y <queries> en AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const mfPath = "android/app/src/main/AndroidManifest.xml";
            let mf = fs.readFileSync(mfPath, "utf8");
            const calAddition = `
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <queries>
                <package android:name="com.google.android.calendar" />
                <package android:name="com.samsung.android.app.calendar" />
                <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:mimeType="text/calendar" />
                </intent>
              </queries>
            </manifest>`;
            if (!mf.includes("WRITE_CALENDAR")) {
              mf = mf.replace("</manifest>", calAddition);
            }
            if (!mf.includes("OmniTaskAlarmReceiver")) {
              mf = mf.replace("</application>", `    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />\n        <receiver android:name=".OmniTaskAlarmReceiver" android:enabled="true" android:exported="false" />\n        <receiver android:name=".OmniTaskBootReceiver" android:enabled="true" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.TIME_SET" /><action android:name="android.intent.action.TIMEZONE_CHANGED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver>\n        <receiver android:name=".OmniTaskWidgetProvider" android:exported="true" android:label="OmniTask Hoy"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/omnitask_widget_info" /></receiver>\n    </application>`);
            }
            fs.writeFileSync(mfPath, mf, "utf8");
            console.log("AndroidManifest.xml actualizado con permisos de Calendario y Alarmas.");
          '

          # 3. Configurar MainActivity.java:
          #    - Respetar barra superior (hora/batería) e inferior en Android 15/16 (WindowInsets)
          #    - Puente nativo OmniTaskNative.syncIcsToCalendar que guarda eventos y alarmas (Reminders.METHOD_ALERT)
          #      directamente en Google Calendar / Calendario del teléfono y abre la app de Calendario al instante
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat > "$MAIN_ACT" << 'JAVAEOF'
          package cl.vorax2009.micalendario;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.os.VibratorManager;
          import android.provider.Settings;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import org.json.JSONObject;
          import com.google.android.play.core.review.ReviewInfo;
          import com.google.android.play.core.review.ReviewManager;
          import com.google.android.play.core.review.ReviewManagerFactory;
          import android.provider.CalendarContract;
          import android.view.HapticFeedbackConstants;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.android.billingclient.api.AcknowledgePurchaseParams;
          import com.android.billingclient.api.BillingClient;
          import com.android.billingclient.api.BillingClientStateListener;
          import com.android.billingclient.api.BillingFlowParams;
          import com.android.billingclient.api.BillingResult;
          import com.android.billingclient.api.PendingPurchasesParams;
          import com.android.billingclient.api.ProductDetails;
          import com.android.billingclient.api.Purchase;
          import com.android.billingclient.api.PurchasesUpdatedListener;
          import com.android.billingclient.api.QueryProductDetailsParams;
          import com.android.billingclient.api.QueryPurchasesParams;
          import com.getcapacitor.BridgeActivity;
          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Calendar;
          import java.util.List;
          import java.util.TimeZone;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_CALENDAR_PERM = 7001;
              private static final String TEST_REWARDED_AD_UNIT_ID = "ca-app-pub-3940256099942544/5224354917";
              private String pendingIcsContent = null;
              private BillingClient billingClient = null;
              private RewardedAd cachedRewardedAd = null;
              private boolean rewardedAdLoading = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  if (window != null) {
                      WindowCompat.setDecorFitsSystemWindows(window, false);
                      window.setStatusBarColor(Color.parseColor("#020617"));
                      window.setNavigationBarColor(Color.parseColor("#020617"));
                      View decor = window.getDecorView();
                      WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(window, decor);
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }
                  View content = findViewById(android.R.id.content);
                  if (content != null) {
                      content.setBackgroundColor(Color.parseColor("#020617"));
                      ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                          Insets insets = windowInsets.getInsets(
                              WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout()
                          );
                          v.setPadding(insets.left, insets.top, insets.right, insets.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      });
                      ViewCompat.requestApplyInsets(content);
                  }
                  getOnBackPressedDispatcher().addCallback(this, new androidx.activity.OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "(function(){ return !!(window.handleOmniTaskBackButton && window.handleOmniTaskBackButton()); })()",
                                  result -> {
                                      if (!"true".equals(result)) {
                                          runOnUiThread(() -> {
                                              setEnabled(false);
                                              getOnBackPressedDispatcher().onBackPressed();
                                              setEnabled(true);
                                          });
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
                  try {
                      MobileAds.initialize(this, status -> preloadRewardedAd());
                  } catch (Exception ignored) {}
                  initBillingClient();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      webView.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public boolean hasNotificationPermission() {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  return ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
                              }
                              return true;
                          }

                          @JavascriptInterface
                          public void requestNotificationPermission() {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  runOnUiThread(() -> ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7002));
                              }
                          }

                          @JavascriptInterface
                          public boolean hasExactAlarmPermission() {
                              if (Build.VERSION.SDK_INT < 31) return true;
                              AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                              return am != null && am.canScheduleExactAlarms();
                          }

                          @JavascriptInterface
                          public void requestExactAlarmPermission() {
                              if (Build.VERSION.SDK_INT >= 31) {
                                  runOnUiThread(() -> {
                                      try {
                                          Intent i = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                                          i.setData(Uri.parse("package:" + getPackageName()));
                                          startActivity(i);
                                      } catch (Exception ignored) {}
                                  });
                              }
                          }

                          @JavascriptInterface
                          public boolean scheduleNativeAlarm(int alarmId, String title, String body, long triggerAtMillis) {
                              if (triggerAtMillis <= System.currentTimeMillis()) return false;
                              if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                  runOnUiThread(() -> ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7002));
                                  return false;
                              }
                              try {
                                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                                  if (am == null) return false;
                                  String safeTitle = (title != null && !title.isEmpty()) ? title : "Recordatorio OmniTask";
                                  String safeBody = (body != null && !body.isEmpty()) ? body : "Tienes una alerta programada.";
                                  Intent rxIntent = new Intent(MainActivity.this, OmniTaskAlarmReceiver.class);
                                  rxIntent.putExtra("alarmId", alarmId);
                                  rxIntent.putExtra("title", safeTitle);
                                  rxIntent.putExtra("body", safeBody);
                                  PendingIntent pi = PendingIntent.getBroadcast(
                                      MainActivity.this, alarmId, rxIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                  );
                                  Intent showInt = new Intent(MainActivity.this, MainActivity.class);
                                  PendingIntent showPi = PendingIntent.getActivity(
                                      MainActivity.this, alarmId, showInt,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                  );
                                  if (Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms()) {
                                      am.setAlarmClock(new AlarmManager.AlarmClockInfo(triggerAtMillis, showPi), pi);
                                  } else if (Build.VERSION.SDK_INT >= 23) {
                                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                                  } else {
                                      am.set(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                                  }

                                  SharedPreferences sp = getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE);
                                  org.json.JSONObject obj = new org.json.JSONObject();
                                  obj.put("id", alarmId);
                                  obj.put("title", safeTitle);
                                  obj.put("body", safeBody);
                                  obj.put("ts", triggerAtMillis);
                                  sp.edit().putString("a_" + alarmId, obj.toString()).apply();
                                  return true;
                              } catch (Exception e) {
                                  e.printStackTrace();
                                  return false;
                              }
                          }

                          @JavascriptInterface
                          public boolean cancelNativeAlarm(int alarmId) {
                              try {
                                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                                  if (am != null) {
                                      Intent rxIntent = new Intent(MainActivity.this, OmniTaskAlarmReceiver.class);
                                      PendingIntent pi = PendingIntent.getBroadcast(
                                          MainActivity.this, alarmId, rxIntent,
                                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                      );
                                      am.cancel(pi);
                                  }
                                  getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE).edit().remove("a_" + alarmId).apply();
                                  return true;
                              } catch (Exception e) { return false; }
                          }

                          @JavascriptInterface
                          public int cancelAllNativeAlarms() {
                              int cleared = 0;
                              try {
                                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                                  SharedPreferences sp = getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE);
                                  for (String key : sp.getAll().keySet()) {
                                      if (key.startsWith("a_")) {
                                          try {
                                              int aid = Integer.parseInt(key.substring(2));
                                              if (am != null) {
                                                  Intent rxIntent = new Intent(MainActivity.this, OmniTaskAlarmReceiver.class);
                                                  PendingIntent pi = PendingIntent.getBroadcast(
                                                      MainActivity.this, aid, rxIntent,
                                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                                  );
                                                  am.cancel(pi);
                                              }
                                              cleared++;
                                          } catch (Exception ignored) {}
                                      }
                                  }
                                  sp.edit().clear().apply();
                              } catch (Exception ignored) {}
                              return cleared;
                          }

                          @JavascriptInterface
                          public void performHapticTap() {
                              runOnUiThread(() -> {
                                  try {
                                      Vibrator vib = null;
                                      if (Build.VERSION.SDK_INT >= 31) {
                                          VibratorManager vm = (VibratorManager) getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                                          if (vm != null) vib = vm.getDefaultVibrator();
                                      } else {
                                          vib = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                                      }
                                      if (vib != null && vib.hasVibrator()) {
                                          if (Build.VERSION.SDK_INT >= 26) {
                                              vib.vibrate(VibrationEffect.createOneShot(30, VibrationEffect.DEFAULT_AMPLITUDE));
                                          } else {
                                              vib.vibrate(30);
                                          }
                                          return;
                                      }
                                      if (getBridge() != null && getBridge().getWebView() != null) {
                                          getBridge().getWebView().performHapticFeedback(
                                              HapticFeedbackConstants.VIRTUAL_KEY,
                                              HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING
                                          );
                                      }
                                  } catch (Exception ignored) {}
                              });
                          }

                          @JavascriptInterface
                          public void playNativeClickSound() {
                              runOnUiThread(() -> {
                                  try {
                                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                                      if (am != null) {
                                          am.playSoundEffect(AudioManager.FX_KEY_CLICK, 1.0f);
                                      }
                                  } catch (Exception ignored) {}
                              });
                          }

                          @JavascriptInterface
                          public String getDeviceTrialHash() {
                              try {
                                  String aid = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                                  if (aid == null || aid.isEmpty()) return "";
                                  MessageDigest md = MessageDigest.getInstance("SHA-256");
                                  byte[] digest = md.digest(("omnitask_v1:" + aid).getBytes("UTF-8"));
                                  StringBuilder sb = new StringBuilder();
                                  for (byte b : digest) sb.append(String.format("%02x", b));
                                  return sb.toString();
                              } catch (Exception e) { return ""; }
                          }

                          @JavascriptInterface
                          public long getOrInitTrialStart() {
                              SharedPreferences sp = getSharedPreferences("omnitask_plan_v1", Context.MODE_PRIVATE);
                              long existing = sp.getLong("trial_start_ms", 0L);
                              if (existing > 1700000000000L) return existing;
                              long now = System.currentTimeMillis();
                              sp.edit().putLong("trial_start_ms", now).apply();
                              return now;
                          }

                          @JavascriptInterface
                          public void syncTrialStart(long ts) {
                              if (ts <= 1700000000000L) return;
                              SharedPreferences sp = getSharedPreferences("omnitask_plan_v1", Context.MODE_PRIVATE);
                              long existing = sp.getLong("trial_start_ms", 0L);
                              if (existing <= 0L || ts < existing) {
                                  sp.edit().putLong("trial_start_ms", ts).apply();
                              }
                          }

                          @JavascriptInterface
                          public long getVideoUnlockUntil() {
                              SharedPreferences sp = getSharedPreferences("omnitask_plan_v1", Context.MODE_PRIVATE);
                              return sp.getLong("video_unlock_until_ms", 0L);
                          }

                          @JavascriptInterface
                          public void saveVideoUnlockUntil(long ts) {
                              SharedPreferences sp = getSharedPreferences("omnitask_plan_v1", Context.MODE_PRIVATE);
                              sp.edit().putLong("video_unlock_until_ms", Math.max(0L, ts)).apply();
                          }

                          @JavascriptInterface
                          public void showRewardedAd() {
                              runOnUiThread(() -> displayRewardedAd());
                          }

                          @JavascriptInterface
                          public void purchasePremium(String productId) {
                              runOnUiThread(() -> launchOneTimePurchase(productId));
                          }

                          @JavascriptInterface
                          public void requestInAppReview() {
                              runOnUiThread(() -> {
                                  try {
                                      ReviewManager manager = ReviewManagerFactory.create(MainActivity.this);
                                      manager.requestReviewFlow().addOnCompleteListener(task -> {
                                          if (task.isSuccessful() && task.getResult() != null) {
                                              ReviewInfo info = task.getResult();
                                              manager.launchReviewFlow(MainActivity.this, info);
                                          }
                                      });
                                  } catch (Exception ignored) {}
                              });
                          }

                          @JavascriptInterface
                          public void updateWidgetData(String jsonStr) {
                              try {
                                  if (jsonStr == null) return;
                                  SharedPreferences sp = getSharedPreferences("omnitask_widget_prefs", Context.MODE_PRIVATE);
                                  sp.edit().putString("widget_json", jsonStr).apply();
                                  OmniTaskWidgetProvider.refreshAllWidgets(MainActivity.this);
                              } catch (Exception ignored) {}
                          }

                          @JavascriptInterface
                          public void openPlayStoreReview() {
                              runOnUiThread(() -> {
                                  try {
                                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + getPackageName()));
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(i);
                                  } catch (Exception e) {
                                      try {
                                          Intent web = new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + getPackageName()));
                                          web.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                          startActivity(web);
                                      } catch (Exception ignored) {}
                                  }
                              });
                          }

                          @JavascriptInterface
                          public void restorePurchases(String productId) {
                              runOnUiThread(() -> queryOwnedOneTimePurchases(productId, true));
                          }

                          @JavascriptInterface
                          public void checkPremiumStatus(String productId) {
                              runOnUiThread(() -> queryOwnedOneTimePurchases(productId, false));
                          }

                          @JavascriptInterface
                          public boolean syncIcsToCalendar(String icsContent, String fileName) {
                              if (icsContent == null || icsContent.isEmpty()) return false;
                              runOnUiThread(() -> {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.WRITE_CALENDAR) != PackageManager.PERMISSION_GRANTED ||
                                      ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                                      pendingIcsContent = icsContent;
                                      ActivityCompat.requestPermissions(
                                          MainActivity.this,
                                          new String[]{Manifest.permission.READ_CALENDAR, Manifest.permission.WRITE_CALENDAR},
                                          REQ_CALENDAR_PERM
                                      );
                                  } else {
                                      insertIcsEventsAndOpenCalendar(icsContent);
                                  }
                              });
                              return true;
                          }
                      }, "OmniTaskNative");
                  }
              }

