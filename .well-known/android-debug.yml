          # 4. Actualizar variables.gradle (minSdk 24, compileSdk 36, targetSdk 36 exigido por Google Play)
          node -e '
            const fs = require("fs");
            let vars = fs.readFileSync("android/variables.gradle", "utf8");
            vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 24");
            vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 36");
            vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 36");
            fs.writeFileSync("android/variables.gradle", vars, "utf8");
          '

          # 5. Suprimir advertencias de versión AGP en gradle.properties
          printf "\nandroid.suppressUnsupportedCompileSdk=35,36\n" >> android/gradle.properties

          # 6. Configurar versionCode, versionName y signingConfigs.release en android/app/build.gradle
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versionName = pkg.version || "1.1.0";
            const runNum = parseInt(process.env.RUN_NUMBER || "1", 10) + 1;
            const ksPass = process.env.KS_PASS;
            const keyAlias = process.env.KEY_ALIAS;
            const keyPass = process.env.KEY_PASS;

            let gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${runNum}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${versionName}"`);

            const signingBlock = `
                signingConfigs {
                    release {
                        storeFile file("omnitask-upload-keystore.jks")
                        storePassword "${ksPass}"
                        keyAlias "${keyAlias}"
                        keyPassword "${keyPass}"
                    }
                }
                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release`;

            gradle = gradle.replace(/buildTypes\s*\{\s*release\s*\{/, signingBlock);
            gradle = gradle.replace(/minifyEnabled\s+false/g, "minifyEnabled true\n            shrinkResources true");
            if (!gradle.includes("minifyEnabled")) {
              gradle = gradle.replace("signingConfig signingConfigs.release", "signingConfig signingConfigs.release\n                        minifyEnabled true\n                        shrinkResources true\n                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'");
            }
            if (!gradle.includes("com.android.billingclient:billing")) {
              gradle = gradle.replace(/dependencies\s*\{/, `dependencies {\n    implementation "com.android.billingclient:billing:8.3.0"\n    implementation "com.google.android.play:review:2.0.2"\n    implementation "com.google.android.gms:play-services-ads:23.6.0"`);
            }
            fs.writeFileSync("android/app/build.gradle", gradle, "utf8");

            const pgRules = `
# OmniTask R8 Keep Rules (Play Console DEX Optimization)
-keepattributes *Annotation*,JavascriptInterface
-keepclassmembers class * {
    @android.webkit.JavascriptInterface <methods>;
}
-keep class cl.vorax2009.micalendario.** { *; }
-keep class com.getcapacitor.** { *; }
-keep class com.android.billingclient.** { *; }
-keep class com.google.android.gms.ads.** { *; }
-keep class com.google.android.play.core.** { *; }
-dontwarn com.google.errorprone.annotations.**
-dontwarn javax.annotation.**
`;
            fs.appendFileSync("android/app/proguard-rules.pro", pgRules);
          '

      - name: Compilar APK Debug, APK Release y AAB Release Firmado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Verificar firma criptográfica del AAB Release
        run: |
          set -o pipefail
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab | head -n 25

      - name: Guardar APK Debug y Release
        uses: actions/upload-artifact@v4
        with:
          name: omnitask-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Guardar AAB Release Firmado (Para Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: omnitask-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
