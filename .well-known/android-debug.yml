              private final PurchasesUpdatedListener purchasesUpdatedListener = (billingResult, purchases) -> {
                  int code = billingResult.getResponseCode();
                  if (code == BillingClient.BillingResponseCode.OK && purchases != null) {
                      for (Purchase p : purchases) {
                          handleOneTimePurchase(p);
                      }
                  } else if (code == BillingClient.BillingResponseCode.USER_CANCELED) {
                      notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,cancelled:true});");
                  } else {
                      String msg = JSONObject.quote(billingResult.getDebugMessage() != null ? billingResult.getDebugMessage() : ("Código " + code));
                      notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,error:" + msg + "});");
                  }
              };

              private void initBillingClient() {
                  if (billingClient != null) return;
                  try {
                      billingClient = BillingClient.newBuilder(this)
                          .setListener(purchasesUpdatedListener)
                          .enablePendingPurchases(PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())
                          .build();
                  } catch (Exception ignored) {}
              }

              private void ensureBillingConnected(Runnable onReady) {
                  initBillingClient();
                  if (billingClient == null) {
                      notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,error:'BillingClient no disponible'});");
                      return;
                  }
                  if (billingClient.isReady()) {
                      onReady.run();
                      return;
                  }
                  billingClient.startConnection(new BillingClientStateListener() {
                      @Override
                      public void onBillingSetupFinished(@NonNull BillingResult br) {
                          if (br.getResponseCode() == BillingClient.BillingResponseCode.OK) {
                              onReady.run();
                          } else {
                              notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,error:'Google Play Billing no listo (" + br.getResponseCode() + ")'});");
                          }
                      }
                      @Override
                      public void onBillingServiceDisconnected() { billingClient = null; }
                  });
              }

              private void handleOneTimePurchase(Purchase purchase) {
                  if (purchase.getProducts() == null || !purchase.getProducts().contains("omnitask_premium_lifetime")) return;
                  if (purchase.getPurchaseState() == Purchase.PurchaseState.PENDING) {
                      notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,pending:true,error:'Compra pendiente de confirmación en Google Play'});");
                      return;
                  }
                  if (purchase.getPurchaseState() != Purchase.PurchaseState.PURCHASED) return;
                  if (!purchase.isAcknowledged()) {
                      final BillingClient client = billingClient;
                      if (client == null) return;
                      AcknowledgePurchaseParams ackParams = AcknowledgePurchaseParams.newBuilder()
                          .setPurchaseToken(purchase.getPurchaseToken())
                          .build();
                      client.acknowledgePurchase(ackParams, ackRes -> {
                          if (ackRes.getResponseCode() == BillingClient.BillingResponseCode.OK) {
                              notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:true,isPremium:true});");
                          } else {
                              String ackMsg = JSONObject.quote(ackRes.getDebugMessage() != null ? ackRes.getDebugMessage() : "Error al confirmar compra");
                              notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,error:" + ackMsg + "});");
                          }
                      });
                  } else {
                      notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:true,isPremium:true});");
                  }
              }

              private void launchOneTimePurchase(String productId) {
                  final String pid = (productId != null && !productId.isEmpty()) ? productId : "omnitask_premium_lifetime";
                  ensureBillingConnected(() -> {
                      final BillingClient client = billingClient;
                      if (client == null) return;
                      QueryProductDetailsParams params = QueryProductDetailsParams.newBuilder()
                          .setProductList(Collections.singletonList(
                              QueryProductDetailsParams.Product.newBuilder()
                                  .setProductId(pid)
                                  .setProductType(BillingClient.ProductType.INAPP)
                                  .build()
                          ))
                          .build();
                      client.queryProductDetailsAsync(params, (br, result) -> {
                          if (br.getResponseCode() != BillingClient.BillingResponseCode.OK || result == null || result.getProductDetailsList().isEmpty()) {
                              notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,error:'Producto " + pid + " aún no activo en Google Play Console'});");
                              return;
                          }
                          ProductDetails pd = result.getProductDetailsList().get(0);
                          BillingFlowParams flowParams = BillingFlowParams.newBuilder()
                              .setProductDetailsParamsList(Collections.singletonList(
                                  BillingFlowParams.ProductDetailsParams.newBuilder()
                                      .setProductDetails(pd)
                                      .build()
                              ))
                              .build();
                          runOnUiThread(() -> { final BillingClient c = billingClient; if (c != null) c.launchBillingFlow(MainActivity.this, flowParams); });
                      });
                  });
              }

              private void queryOwnedOneTimePurchases(String productId, boolean notifyIfEmpty) {
                  final String pid = (productId != null && !productId.isEmpty()) ? productId : "omnitask_premium_lifetime";
                  ensureBillingConnected(() -> {
                      final BillingClient client = billingClient;
                      if (client == null) return;
                      QueryPurchasesParams qp = QueryPurchasesParams.newBuilder()
                          .setProductType(BillingClient.ProductType.INAPP)
                          .build();
                      client.queryPurchasesAsync(qp, (br, purchases) -> {
                          boolean found = false;
                          if (br.getResponseCode() == BillingClient.BillingResponseCode.OK && purchases != null) {
                              for (Purchase p : purchases) {
                                  if (p.getPurchaseState() == Purchase.PurchaseState.PURCHASED && p.getProducts().contains(pid)) {
                                      found = true;
                                      handleOneTimePurchase(p);
                                  }
                              }
                          }
                          if (!found && notifyIfEmpty) {
                              notifyJs("window.onOmniTaskBillingResult && window.onOmniTaskBillingResult({ok:false,error:'No se encontró una compra Premium previa en esta cuenta de Google.'});");
                          }
                      });
                  });
              }

