name: Android APK y AAB Firmado (OmniTask Play Store)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 (Compatible con Gradle de Capacitor 6)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Armar carpetas web y recursos
        run: |
          mkdir -p www assets
          cp index.html privacy.html sw.js manifest.webmanifest icon.svg version.json www/
          cp omnitask-icon-*.png screenshot-*.png www/
          cp icon-only.png assets/icon-only.png
          cp icon-only.png assets/icon.png
          cp icon-only.png assets/icon-foreground.png

      - name: Precompilar Tailwind CSS (regenera todas las clases del index.html)
        continue-on-error: true
        run: |
          cat > tailwind.config.js << 'TWCFG'
          module.exports = {
            content: ["./www/index.html"],
            theme: {
              extend: {
                fontFamily: {
                  sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                }
              }
            }
          }
          TWCFG
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind-input.css

          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i tailwind-input.css -o www/tailwind-compiled.css --minify

          if [ -s www/tailwind-compiled.css ]; then
            node -e '
              const fs = require("fs");
              const html = fs.readFileSync("www/index.html", "utf8");
              const css = fs.readFileSync("www/tailwind-compiled.css", "utf8");
              if (css.length < 5000) { console.log("CSS demasiado corto, se conserva el del index.html"); process.exit(0); }
              const re = /<style id="tailwind-compiled">[\s\S]*?<\/style>/;
              if (!re.test(html)) { console.log("No se encontró el bloque tailwind-compiled"); process.exit(0); }
              const updated = html.replace(re, () => `<style id="tailwind-compiled">${css}</style>`);
              fs.writeFileSync("www/index.html", updated, "utf8");
              console.log("Tailwind CSS regenerado:", css.length, "bytes");
            '
            rm -f www/tailwind-compiled.css
          fi

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android Capacitor
        run: npx cap add android

      - name: Generar iconos nativos Android
        run: |
          if command -v convert >/dev/null 2>&1; then
            convert -size 1024x1024 xc:"#070C1B" assets/icon-background.png
          fi
          npx capacitor-assets generate --android --iconBackgroundColor "#070C1B" --iconBackgroundColorDark "#070C1B" || true
          if command -v convert >/dev/null 2>&1; then
            for pair in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
              IFS=':' read -r dens sz fg <<< "$pair"
              dir="android/app/src/main/res/mipmap-$dens"
              mkdir -p "$dir"
              convert icon-only.png -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert icon-only.png -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert icon-only.png -resize "${fg}x${fg}" "$dir/ic_launcher_foreground.png"
            done
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Instalar Android SDK Platform 35 si no está presente
        run: |
          if [ -n "$ANDROID_HOME" ] && [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi

      - name: Configurar Target SDK 36, Márgenes de Sistema, Sincronización Directa con Google Calendar y Firma Keystore
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'OmniTask2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omnitask' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'OmniTask2026!' }}
        run: |
          # 1. Preparar el archivo Keystore (.jks) en android/app/
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/omnitask-upload-keystore.jks
            echo "Keystore cargado desde GitHub Secrets"
          elif [ -f "omnitask-upload-keystore.jks" ]; then
            cp omnitask-upload-keystore.jks android/app/omnitask-upload-keystore.jks
            echo "Keystore cargado desde el repositorio (omnitask-upload-keystore.jks)"
          else
            keytool -genkeypair -v -keystore android/app/omnitask-upload-keystore.jks -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=Nicolas Alejandro Toro Reyes, OU=OmniTask, O=Vorax2009, L=Puerto Montt, ST=Los Lagos, C=CL"
            echo "Keystore generado automáticamente"
          fi

          # 2. Agregar permisos READ_CALENDAR / WRITE_CALENDAR y <queries> en AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const mfPath = "android/app/src/main/AndroidManifest.xml";
            let mf = fs.readFileSync(mfPath, "utf8");
            const calAddition = `
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <queries>
                <package android:name="com.google.android.calendar" />
                <package android:name="com.samsung.android.app.calendar" />
                <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <data android:mimeType="text/calendar" />
                </intent>
              </queries>
            </manifest>`;
            if (!mf.includes("WRITE_CALENDAR")) {
              mf = mf.replace("</manifest>", calAddition);
            }
            if (!mf.includes("OmniTaskAlarmReceiver")) {
              mf = mf.replace("</application>", '    <receiver android:name=".OmniTaskAlarmReceiver" android:enabled="true" android:exported="false" />\n        <receiver android:name=".OmniTaskBootReceiver" android:enabled="true" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver>\n    </application>');
            }
            fs.writeFileSync(mfPath, mf, "utf8");
            console.log("AndroidManifest.xml actualizado con permisos de Calendario y Alarmas.");
          '

          # 3. Configurar MainActivity.java:
          #    - Respetar barra superior (hora/batería) e inferior en Android 15/16 (WindowInsets)
          #    - Puente nativo OmniTaskNative.syncIcsToCalendar que guarda eventos y alarmas (Reminders.METHOD_ALERT)
          #      directamente en Google Calendar / Calendario del teléfono y abre la app de Calendario al instante
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat > "$MAIN_ACT" << 'JAVAEOF'
          package cl.vorax2009.micalendario;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.CalendarContract;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import java.util.TimeZone;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_CALENDAR_PERM = 7001;
              private String pendingIcsContent = null;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  if (window != null) {
                      WindowCompat.setDecorFitsSystemWindows(window, false);
                      window.setStatusBarColor(Color.parseColor("#020617"));
                      window.setNavigationBarColor(Color.parseColor("#020617"));
                      View decor = window.getDecorView();
                      WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(window, decor);
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }
                  View content = findViewById(android.R.id.content);
                  if (content != null) {
                      content.setBackgroundColor(Color.parseColor("#020617"));
                      ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                          Insets insets = windowInsets.getInsets(
                              WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout()
                          );
                          v.setPadding(insets.left, insets.top, insets.right, insets.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      });
                      ViewCompat.requestApplyInsets(content);
                  }
                  getOnBackPressedDispatcher().addCallback(this, new androidx.activity.OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "(function(){ return !!(window.handleOmniTaskBackButton && window.handleOmniTaskBackButton()); })()",
                                  result -> {
                                      if (!"true".equals(result)) {
                                          runOnUiThread(() -> {
                                              setEnabled(false);
                                              getOnBackPressedDispatcher().onBackPressed();
                                              setEnabled(true);
                                          });
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      webView.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public boolean hasNotificationPermission() {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  return ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
                              }
                              return true;
                          }

                          @JavascriptInterface
                          public void requestNotificationPermission() {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  runOnUiThread(() -> ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7002));
                              }
                          }

                          @JavascriptInterface
                          public boolean scheduleNativeAlarm(int alarmId, String title, String body, long triggerAtMillis) {
                              if (triggerAtMillis <= System.currentTimeMillis()) return false;
                              if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                  runOnUiThread(() -> ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7002));
                                  return false;
                              }
                              try {
                                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                                  if (am == null) return false;
                                  String safeTitle = (title != null && !title.isEmpty()) ? title : "Recordatorio OmniTask";
                                  String safeBody = (body != null && !body.isEmpty()) ? body : "Tienes una alerta programada.";
                                  Intent rxIntent = new Intent(MainActivity.this, OmniTaskAlarmReceiver.class);
                                  rxIntent.putExtra("alarmId", alarmId);
                                  rxIntent.putExtra("title", safeTitle);
                                  rxIntent.putExtra("body", safeBody);
                                  PendingIntent pi = PendingIntent.getBroadcast(
                                      MainActivity.this, alarmId, rxIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                  );
                                  Intent showInt = new Intent(MainActivity.this, MainActivity.class);
                                  PendingIntent showPi = PendingIntent.getActivity(
                                      MainActivity.this, alarmId, showInt,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                  );
                                  am.setAlarmClock(new AlarmManager.AlarmClockInfo(triggerAtMillis, showPi), pi);

                                  SharedPreferences sp = getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE);
                                  org.json.JSONObject obj = new org.json.JSONObject();
                                  obj.put("id", alarmId);
                                  obj.put("title", safeTitle);
                                  obj.put("body", safeBody);
                                  obj.put("ts", triggerAtMillis);
                                  sp.edit().putString("a_" + alarmId, obj.toString()).apply();
                                  return true;
                              } catch (Exception e) {
                                  e.printStackTrace();
                                  return false;
                              }
                          }

                          @JavascriptInterface
                          public boolean cancelNativeAlarm(int alarmId) {
                              try {
                                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                                  if (am != null) {
                                      Intent rxIntent = new Intent(MainActivity.this, OmniTaskAlarmReceiver.class);
                                      PendingIntent pi = PendingIntent.getBroadcast(
                                          MainActivity.this, alarmId, rxIntent,
                                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                      );
                                      am.cancel(pi);
                                  }
                                  getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE).edit().remove("a_" + alarmId).apply();
                                  return true;
                              } catch (Exception e) { return false; }
                          }

                          @JavascriptInterface
                          public int cancelAllNativeAlarms() {
                              int cleared = 0;
                              try {
                                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                                  SharedPreferences sp = getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE);
                                  for (String key : sp.getAll().keySet()) {
                                      if (key.startsWith("a_")) {
                                          try {
                                              int aid = Integer.parseInt(key.substring(2));
                                              if (am != null) {
                                                  Intent rxIntent = new Intent(MainActivity.this, OmniTaskAlarmReceiver.class);
                                                  PendingIntent pi = PendingIntent.getBroadcast(
                                                      MainActivity.this, aid, rxIntent,
                                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                                  );
                                                  am.cancel(pi);
                                              }
                                              cleared++;
                                          } catch (Exception ignored) {}
                                      }
                                  }
                                  sp.edit().clear().apply();
                              } catch (Exception ignored) {}
                              return cleared;
                          }

                          @JavascriptInterface
                          public boolean syncIcsToCalendar(String icsContent, String fileName) {
                              if (icsContent == null || icsContent.isEmpty()) return false;
                              runOnUiThread(() -> {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.WRITE_CALENDAR) != PackageManager.PERMISSION_GRANTED ||
                                      ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                                      pendingIcsContent = icsContent;
                                      ActivityCompat.requestPermissions(
                                          MainActivity.this,
                                          new String[]{Manifest.permission.READ_CALENDAR, Manifest.permission.WRITE_CALENDAR},
                                          REQ_CALENDAR_PERM
                                      );
                                  } else {
                                      insertIcsEventsAndOpenCalendar(icsContent);
                                  }
                              });
                              return true;
                          }
                      }, "OmniTaskNative");
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 7002) {
                      boolean grantedNotif = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          final String jsCall = "window.onOmniTaskNotifPermissionResult && window.onOmniTaskNotifPermissionResult(" + grantedNotif + ")";
                          getBridge().getWebView().evaluateJavascript(jsCall, null);
                      }
                  }
                  if (requestCode == REQ_CALENDAR_PERM) {
                      boolean granted = grantResults.length >= 2 && grantResults[0] == PackageManager.PERMISSION_GRANTED && grantResults[1] == PackageManager.PERMISSION_GRANTED;
                      if (granted && pendingIcsContent != null) {
                          String toSync = pendingIcsContent;
                          pendingIcsContent = null;
                          insertIcsEventsAndOpenCalendar(toSync);
                      } else {
                          Toast.makeText(this, "Permiso de Calendario requerido para guardar eventos y alarmas.", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private long findTargetCalendarId(ContentResolver cr) {
                  Uri uri = CalendarContract.Calendars.CONTENT_URI;
                  String[] proj = new String[]{
                      CalendarContract.Calendars._ID,
                      CalendarContract.Calendars.ACCOUNT_TYPE,
                      CalendarContract.Calendars.IS_PRIMARY,
                      CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL,
                      CalendarContract.Calendars.VISIBLE
                  };
                  long fallbackId = -1;
                  long googleId = -1;
                  try (Cursor c = cr.query(uri, proj, null, null, null)) {
                      if (c != null) {
                          while (c.moveToNext()) {
                              long id = c.getLong(0);
                              String accType = c.getString(1);
                              int isPrimary = c.getInt(2);
                              int access = c.getInt(3);
                              int visible = c.getInt(4);
                              if (access >= CalendarContract.Calendars.CAL_ACCESS_CONTRIBUTOR && visible == 1) {
                                  if (fallbackId == -1) fallbackId = id;
                                  if ("com.google".equalsIgnoreCase(accType)) {
                                      if (isPrimary == 1) return id;
                                      if (googleId == -1) googleId = id;
                                  } else if (isPrimary == 1) {
                                      fallbackId = id;
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return googleId != -1 ? googleId : fallbackId;
              }

              private int parseTriggerMinutes(String trig) {
                  if (trig == null) return 30;
                  String t = trig.trim().toUpperCase();
                  boolean isBefore = t.startsWith("-");
                  if (t.contains("P1D")) return isBefore ? 1440 : -1440;
                  Matcher mMin = Pattern.compile("-?PT(\\d+)M").matcher(t);
                  if (mMin.find()) {
                      try {
                          int mins = Integer.parseInt(mMin.group(1));
                          return isBefore ? mins : -mins;
                      } catch (Exception ignored) {}
                  }
                  Matcher mHr = Pattern.compile("-?PT(\\d+)H").matcher(t);
                  if (mHr.find()) {
                      try {
                          int mins = Integer.parseInt(mHr.group(1)) * 60;
                          return isBefore ? mins : -mins;
                      } catch (Exception ignored) {}
                  }
                  return 30;
              }

              private long parseIcsDateMillis(String raw, boolean isAllDay) {
                  try {
                      String clean = raw.trim();
                      int y = Integer.parseInt(clean.substring(0, 4));
                      int m = Integer.parseInt(clean.substring(4, 6)) - 1;
                      int d = Integer.parseInt(clean.substring(6, 8));
                      if (isAllDay || clean.length() < 13 || !clean.contains("T")) {
                          Calendar cal = Calendar.getInstance(TimeZone.getTimeZone("UTC"));
                          cal.set(y, m, d, 0, 0, 0);
                          cal.set(Calendar.MILLISECOND, 0);
                          return cal.getTimeInMillis();
                      }
                      int tIdx = clean.indexOf('T');
                      int hh = Integer.parseInt(clean.substring(tIdx + 1, tIdx + 3));
                      int mm = Integer.parseInt(clean.substring(tIdx + 3, tIdx + 5));
                      Calendar cal = Calendar.getInstance(TimeZone.getDefault());
                      cal.set(y, m, d, hh, mm, 0);
                      cal.set(Calendar.MILLISECOND, 0);
                      return cal.getTimeInMillis();
                  } catch (Exception e) {
                      return System.currentTimeMillis();
                  }
              }

              private String unescapeIcs(String val) {
                  if (val == null) return "";
                  return val.replace("\\n", "\n")
                            .replace("\\,", ",")
                            .replace("\\;", ";")
                            .replace("\\\\", "\\")
                            .trim();
              }

              private void insertIcsEventsAndOpenCalendar(String icsContent) {
                  new Thread(() -> {
                      int insertedCount = 0;
                      int alarmCount = 0;
                      try {
                          ContentResolver cr = getContentResolver();
                          long calId = findTargetCalendarId(cr);
                          if (calId == -1) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "No se encontró una cuenta de calendario activa en el teléfono.", Toast.LENGTH_LONG).show());
                              return;
                          }

                          String unfolded = icsContent.replaceAll("\\r?\\n[ \\t]", "");
                          String[] lines = unfolded.split("\\r?\\n");

                          boolean inEvent = false;
                          boolean inAlarm = false;
                          String summary = "";
                          String description = "";
                          String location = "";
                          String dtStartRaw = "";
                          String dtEndRaw = "";
                          boolean isAllDay = false;
                          List<Integer> alarmMinutes = new ArrayList<>();

                          for (String line : lines) {
                              if ("BEGIN:VEVENT".equals(line)) {
                                  inEvent = true;
                                  inAlarm = false;
                                  summary = "";
                                  description = "";
                                  location = "";
                                  dtStartRaw = "";
                                  dtEndRaw = "";
                                  isAllDay = false;
                                  alarmMinutes.clear();
                                  continue;
                              }
                              if ("BEGIN:VALARM".equals(line)) {
                                  inAlarm = true;
                                  continue;
                              }
                              if ("END:VALARM".equals(line)) {
                                  inAlarm = false;
                                  continue;
                              }
                              if ("END:VEVENT".equals(line)) {
                                  if (inEvent && !dtStartRaw.isEmpty() && !summary.isEmpty()) {
                                      long startMs = parseIcsDateMillis(dtStartRaw, isAllDay);
                                      long endMs = dtEndRaw.isEmpty() ? (startMs + (isAllDay ? 86400000L : 3600000L)) : parseIcsDateMillis(dtEndRaw, isAllDay);
                                      if (endMs <= startMs) endMs = startMs + (isAllDay ? 86400000L : 1800000L);

                                      long existingEventId = -1;
                                      String sel = CalendarContract.Events.CALENDAR_ID + "=? AND " +
                                                   CalendarContract.Events.TITLE + "=? AND " +
                                                   CalendarContract.Events.DTSTART + "=? AND " +
                                                   CalendarContract.Events.DELETED + "=0";
                                      String[] selArgs = new String[]{String.valueOf(calId), summary, String.valueOf(startMs)};
                                      try (Cursor ec = cr.query(CalendarContract.Events.CONTENT_URI, new String[]{CalendarContract.Events._ID}, sel, selArgs, null)) {
                                          if (ec != null && ec.moveToFirst()) {
                                              existingEventId = ec.getLong(0);
                                          }
                                      } catch (Exception ignored) {}

                                      long eventId = existingEventId;
                                      if (eventId == -1) {
                                          ContentValues ev = new ContentValues();
                                          ev.put(CalendarContract.Events.CALENDAR_ID, calId);
                                          ev.put(CalendarContract.Events.TITLE, summary);
                                          ev.put(CalendarContract.Events.DESCRIPTION, description);
                                          if (!location.isEmpty()) ev.put(CalendarContract.Events.EVENT_LOCATION, location);
                                          ev.put(CalendarContract.Events.DTSTART, startMs);
                                          ev.put(CalendarContract.Events.DTEND, endMs);
                                          ev.put(CalendarContract.Events.ALL_DAY, isAllDay ? 1 : 0);
                                          ev.put(CalendarContract.Events.HAS_ALARM, alarmMinutes.isEmpty() ? 0 : 1);
                                          ev.put(CalendarContract.Events.EVENT_TIMEZONE, isAllDay ? "UTC" : TimeZone.getDefault().getID());
                                          Uri insertedUri = cr.insert(CalendarContract.Events.CONTENT_URI, ev);
                                          if (insertedUri != null) {
                                              eventId = ContentUris.parseId(insertedUri);
                                              insertedCount++;
                                          }
                                      } else {
                                          insertedCount++;
                                      }

                                      if (eventId != -1 && !alarmMinutes.isEmpty()) {
                                          try {
                                              cr.delete(CalendarContract.Reminders.CONTENT_URI, CalendarContract.Reminders.EVENT_ID + "=?", new String[]{String.valueOf(eventId)});
                                          } catch (Exception ignored) {}
                                          for (Integer mins : alarmMinutes) {
                                              ContentValues rem = new ContentValues();
                                              rem.put(CalendarContract.Reminders.EVENT_ID, eventId);
                                              rem.put(CalendarContract.Reminders.MINUTES, mins);
                                              rem.put(CalendarContract.Reminders.METHOD, CalendarContract.Reminders.METHOD_ALERT);
                                              cr.insert(CalendarContract.Reminders.CONTENT_URI, rem);
                                              alarmCount++;
                                          }
                                      }
                                  }
                                  inEvent = false;
                                  continue;
                              }
                              if (!inEvent) continue;
                              int colon = line.indexOf(':');
                              if (colon == -1) continue;
                              String keyPart = line.substring(0, colon).toUpperCase();
                              String valPart = line.substring(colon + 1);
                              if (inAlarm) {
                                  if (keyPart.startsWith("TRIGGER")) {
                                      alarmMinutes.add(parseTriggerMinutes(valPart));
                                  }
                              } else {
                                  if (keyPart.startsWith("SUMMARY")) {
                                      summary = unescapeIcs(valPart);
                                  } else if (keyPart.startsWith("DESCRIPTION")) {
                                      description = unescapeIcs(valPart);
                                  } else if (keyPart.startsWith("LOCATION")) {
                                      location = unescapeIcs(valPart);
                                  } else if (keyPart.startsWith("DTSTART")) {
                                      isAllDay = keyPart.contains("VALUE=DATE") || valPart.trim().length() == 8;
                                      dtStartRaw = valPart.trim();
                                  } else if (keyPart.startsWith("DTEND")) {
                                      dtEndRaw = valPart.trim();
                                  }
                              }
                          }

                          final int finalInserted = insertedCount;
                          final int finalAlarms = alarmCount;
                          final long openTimeMs = System.currentTimeMillis();
                          runOnUiThread(() -> {
                              Toast.makeText(
                                  MainActivity.this,
                                  "OmniTask: " + finalInserted + " eventos y " + finalAlarms + " alarmas guardados en tu Calendario.",
                                  Toast.LENGTH_LONG
                              ).show();
                              try {
                                  Uri.Builder builder = CalendarContract.CONTENT_URI.buildUpon();
                                  builder.appendPath("time");
                                  ContentUris.appendId(builder, openTimeMs);
                                  Intent calIntent = new Intent(Intent.ACTION_VIEW).setData(builder.build());
                                  calIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(calIntent);
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                          });
                      } catch (Exception e) {
                          e.printStackTrace();
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Error al guardar en Calendario: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }
          }
          JAVAEOF
            RECEIVER_PATH="$(dirname "$MAIN_ACT")/OmniTaskAlarmReceiver.java"
            cat > "$RECEIVER_PATH" << 'RXEOF'
          package cl.vorax2009.micalendario;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class OmniTaskAlarmReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "omnitask_alarms_v1";

              @Override
              public void onReceive(Context context, Intent intent) {
                  PowerManager pm = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                  PowerManager.WakeLock wl = null;
                  if (pm != null) {
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "OmniTask:AlarmWake");
                      wl.acquire(10000L);
                  }
                  try {
                      int alarmId = intent.getIntExtra("alarmId", (int) (System.currentTimeMillis() % 100000));
                      String title = intent.getStringExtra("title");
                      String body = intent.getStringExtra("body");
                      if (title == null || title.isEmpty()) title = "OmniTask · Alarma";
                      if (body == null || body.isEmpty()) body = "Tienes un recordatorio programado.";

                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;

                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      if (soundUri == null) soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID,
                              "Alarmas y Recordatorios OmniTask",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          ch.setDescription("Alertas exactas aunque la app esté cerrada");
                          ch.enableVibration(true);
                          ch.setVibrationPattern(new long[]{0, 400, 250, 400});
                          if (soundUri != null) {
                              AudioAttributes aa = new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build();
                              ch.setSound(soundUri, aa);
                          }
                          nm.createNotificationChannel(ch);
                      }

                      Intent openInt = new Intent(context, MainActivity.class);
                      openInt.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(
                          context, alarmId, openInt,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      NotificationCompat.Builder nb = new NotificationCompat.Builder(context, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_ALARM)
                          .setAutoCancel(true)
                          .setDefaults(NotificationCompat.DEFAULT_VIBRATE)
                          .setContentIntent(pi);
                      if (soundUri != null) nb.setSound(soundUri);

                      nm.notify(alarmId, nb.build());
                  } finally {
                      if (wl != null && wl.isHeld()) {
                          try { wl.release(); } catch (Exception ignored) {}
                      }
                  }
              }
          }
          RXEOF
            BOOT_PATH="$(dirname "$MAIN_ACT")/OmniTaskBootReceiver.java"
            cat > "$BOOT_PATH" << 'BOOTEOF'
          package cl.vorax2009.micalendario;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import org.json.JSONObject;
          import java.util.Map;

          public class OmniTaskBootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || !Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) return;
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  SharedPreferences sp = context.getSharedPreferences("omnitask_native_alarms_v1", Context.MODE_PRIVATE);
                  long now = System.currentTimeMillis();
                  for (Map.Entry<String, ?> entry : sp.getAll().entrySet()) {
                      if (!entry.getKey().startsWith("a_")) continue;
                      try {
                          JSONObject obj = new JSONObject(String.valueOf(entry.getValue()));
                          long ts = obj.optLong("ts", 0);
                          if (ts <= now) {
                              sp.edit().remove(entry.getKey()).apply();
                              continue;
                          }
                          int id = obj.getInt("id");
                          String title = obj.optString("title", "OmniTask · Alarma");
                          String body = obj.optString("body", "Recordatorio programado");
                          Intent rxIntent = new Intent(context, OmniTaskAlarmReceiver.class);
                          rxIntent.putExtra("alarmId", id);
                          rxIntent.putExtra("title", title);
                          rxIntent.putExtra("body", body);
                          PendingIntent pi = PendingIntent.getBroadcast(
                              context, id, rxIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          Intent showInt = new Intent(context, MainActivity.class);
                          PendingIntent showPi = PendingIntent.getActivity(
                              context, id, showInt,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          am.setAlarmClock(new AlarmManager.AlarmClockInfo(ts, showPi), pi);
                      } catch (Exception ignored) {}
                  }
              }
          }
          BOOTEOF
            echo "MainActivity.java, OmniTaskAlarmReceiver.java y OmniTaskBootReceiver.java actualizados."
          fi

          # 4. Actualizar variables.gradle (minSdk 24, compileSdk 35 compatible con AGP 8.2, targetSdk 36 exigido por Google Play)
          node -e '
            const fs = require("fs");
            let vars = fs.readFileSync("android/variables.gradle", "utf8");
            vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 24");
            vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 35");
            vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 36");
            fs.writeFileSync("android/variables.gradle", vars, "utf8");
          '

          # 5. Suprimir advertencias de versión AGP en gradle.properties
          printf "\nandroid.suppressUnsupportedCompileSdk=35,36\n" >> android/gradle.properties

          # 6. Configurar versionCode, versionName y signingConfigs.release en android/app/build.gradle
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versionName = pkg.version || "1.1.0";
            const runNum = parseInt(process.env.RUN_NUMBER || "1", 10) + 1;
            const ksPass = process.env.KS_PASS;
            const keyAlias = process.env.KEY_ALIAS;
            const keyPass = process.env.KEY_PASS;

            let gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${runNum}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${versionName}"`);

            const signingBlock = `
                signingConfigs {
                    release {
                        storeFile file("omnitask-upload-keystore.jks")
                        storePassword "${ksPass}"
                        keyAlias "${keyAlias}"
                        keyPassword "${keyPass}"
                    }
                }
                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release`;

            gradle = gradle.replace(/buildTypes\s*\{\s*release\s*\{/, signingBlock);
            fs.writeFileSync("android/app/build.gradle", gradle, "utf8");
          '

      - name: Compilar APK Debug, APK Release y AAB Release Firmado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Verificar firma criptográfica del AAB Release
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab | head -n 25

      - name: Guardar APK Debug y Release
        uses: actions/upload-artifact@v4
        with:
          name: omnitask-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Guardar AAB Release Firmado (Para Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: omnitask-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
